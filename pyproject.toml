[tool.ruff]
line-length = 110
target-version = "py312"

extend-exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
"app/api/routes.py" = ["F401"]
"app/ai/insight.py" = ["F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
